packages:
  - client

# 公開から 7 日(分単位)経っていないバージョンは解決しない。Renovate の minimumReleaseAge と揃える
minimumReleaseAge: 10080

# node-pty はネイティブモジュールのビルド(install スクリプト)が必要
# lefthook の postinstall(フックの自動インストール)は使わず、package.json の prepare で入れる
allowBuilds:
  lefthook: false
  node-pty: true
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.2.4
  - vite@8.2.4
